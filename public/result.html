<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>考试结果 - 培训考核系统</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      background: #E8EDF2;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .result-container {
      max-width: 900px;
      margin: 0 auto;
    }
    .result-summary-card {
      background: white;
      border-radius: 16px;
      padding: 48px;
      text-align: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }
    .result-summary-card h2 {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      margin: 0 0 8px 0;
    }
    .result-big-score {
      font-size: 64px;
      font-weight: 800;
      margin: 16px 0 4px 0;
    }
    .result-big-score.pass { color: var(--primary); }
    .result-big-score.fail { color: var(--danger); }
    .result-subtitle {
      color: var(--text-light);
      font-size: 14px;
      margin-bottom: 16px;
    }
    .result-badge {
      display: inline-block;
      padding: 8px 24px;
      border-radius: 20px;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 24px;
    }
    .result-badge.pass {
      background: var(--primary-light);
      color: var(--primary-dark);
    }
    .result-badge.fail {
      background: #FFEBEE;
      color: var(--danger);
    }
    .result-stats-row {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin: 24px 0;
      flex-wrap: wrap;
    }
    .result-stat-item {
      text-align: center;
    }
    .result-stat-item .num {
      font-size: 32px;
      font-weight: 700;
      line-height: 1.2;
    }
    .result-stat-item .label {
      font-size: 13px;
      color: var(--text-light);
      margin-top: 4px;
    }
    .result-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .result-actions .btn {
      padding: 12px 32px;
      font-size: 15px;
      font-weight: 600;
      min-width: 140px;
    }
    .btn-review {
      background: white;
      border: 2px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 12px 32px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      min-width: 140px;
    }
    .btn-review:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-light);
    }
    .exam-info {
      font-size: 13px;
      color: var(--text-light);
      margin-top: 16px;
      line-height: 1.8;
    }
    .warning-text {
      color: #E65100;
      font-size: 14px;
      margin-top: 12px;
    }

    /* 答题详情 */
    .review-section {
      display: none;
      margin-top: 20px;
    }
    .review-section.show {
      display: block;
    }
    .review-item {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.06);
      text-align: left;
    }
    .review-item.correct { border-left: 4px solid #4CAF50; }
    .review-item.wrong { border-left: 4px solid #EF5350; }
    .review-item.unanswered { border-left: 4px solid var(--text-light); }
    .review-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .review-header .q-num {
      font-weight: 700;
      color: var(--primary);
    }
    .review-header .q-type {
      font-size: 12px;
      padding: 2px 10px;
      border-radius: 4px;
      font-weight: 600;
    }
    .review-header .q-type.single { background: #E3F2FD; color: #1976D2; }
    .review-header .q-type.multiple { background: #FFF3E0; color: #F57C00; }
    .review-header .q-type.judge { background: #E8F5E9; color: #388E3C; }
    .review-header .q-score {
      font-size: 12px;
      color: var(--text-light);
      margin-left: auto;
    }
    .review-content {
      font-size: 15px;
      line-height: 1.8;
      margin-bottom: 12px;
    }
    .review-option {
      padding: 8px 14px;
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 14px;
    }
    .review-option.correct-bg { background: #E8F5E9; }
    .review-option.wrong-bg { background: #FFEBEE; }
    .review-ans-line {
      font-size: 14px;
      margin: 8px 0;
    }
    .review-explain {
      margin-top: 10px;
      padding: 10px 14px;
      background: #F5F5F5;
      border-radius: 6px;
      font-size: 13px;
      color: var(--text-light);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="result-container">
    <!-- 结果总览 -->
    <div class="result-summary-card" id="resultSummary">
      <div class="empty-state">
        <div class="icon">⏳</div>
        <p>正在加载考试结果...</p>
      </div>
    </div>

    <!-- 答题详情 -->
    <div class="review-section" id="reviewSection"></div>
  </div>

  <script>
    async function init() {
      const params = new URLSearchParams(window.location.search);
      const examId = params.get('id');
      if (!examId) {
        window.location.href = '/exam-start.html';
        return;
      }

      try {
        const res = await fetch(`/api/exam/${examId}/result`);
        const data = await res.json();
        renderResult(data);
      } catch (err) {
        document.getElementById('resultSummary').innerHTML = '<div class="alert alert-danger">加载失败</div>';
      }
    }

    function renderResult(data) {
      const { exam, questions } = data;
      const isPass = exam.result === '合格';
      const correctCount = questions.filter(q => q.is_correct === 1).length;
      const wrongCount = questions.filter(q => q.is_correct === 0 && q.user_answer).length;
      const unansweredCount = questions.filter(q => !q.user_answer).length;
      const total = questions.length;
      const answeredCount = total - unansweredCount;
      const accuracy = total > 0 ? Math.round(correctCount / total * 100) : 0;

      let html = `
        <h2>考试完成！</h2>
        <div class="result-big-score ${isPass ? 'pass' : 'fail'}">${exam.score}分</div>
        <div class="result-subtitle">满分 ${exam.total_score} 分 | 合格线 70 分 | 正确率 ${accuracy}%</div>
        <div class="result-badge ${isPass ? 'pass' : 'fail'}">${exam.result}</div>

        <div class="result-stats-row">
          <div class="result-stat-item">
            <div class="num" style="color:#4CAF50;">${correctCount}</div>
            <div class="label">正确</div>
          </div>
          <div class="result-stat-item">
            <div class="num" style="color:#EF5350;">${wrongCount}</div>
            <div class="label">错误</div>
          </div>
          <div class="result-stat-item">
            <div class="num" style="color:var(--text);">${total}</div>
            <div class="label">总计</div>
          </div>
          <div class="result-stat-item">
            <div class="num" style="color:var(--primary);">${answeredCount}</div>
            <div class="label">已答</div>
          </div>
        </div>

        <div class="result-actions">
          <button class="btn btn-primary" onclick="goExamStart()">继续考试</button>
          <button class="btn btn-outline" onclick="goHome()">返回主页</button>
        </div>
        <button class="btn-review" onclick="toggleReview()">查看全部解析</button>

        <div class="exam-info">
          考试类型：${exam.exam_type} |
          岗位：${exam.position || '-'} |
          ${exam.subject_d_category ? '专业大类：' + exam.subject_d_category + ' | ' : ''}
          切屏次数：${exam.switch_count}
        </div>
      `;

      if (exam.submit_reason && exam.submit_reason !== 'manual') {
        const reasonText = exam.submit_reason === '切屏超过3次自动提交'
          ? '⚠️ 因切屏超过3次，考试已自动提交'
          : '⏰ 考试时间到，已自动提交';
        html += `<div class="warning-text">${reasonText}</div>`;
      }

      document.getElementById('resultSummary').innerHTML = html;

      // 预渲染答题详情（默认隐藏）
      renderReviewDetails(questions);
    }

    function renderReviewDetails(questions) {
      let html = '';
      for (let i = 0; i < questions.length; i++) {
        const q = questions[i];
        const userAns = q.user_answer || '';
        const isCorrect = q.is_correct === 1;
        const isUnanswered = !q.user_answer;
        const correctAns = q.correct_answer;

        let typeClass = '';
        if (q.type === '单选题') typeClass = 'single';
        else if (q.type === '多选题') typeClass = 'multiple';
        else if (q.type === '判断题') typeClass = 'judge';

        let itemClass = isCorrect ? 'correct' : (isUnanswered ? 'unanswered' : 'wrong');
        let statusIcon = isCorrect ? '✅' : (isUnanswered ? '⚪' : '❌');

        html += `<div class="review-item ${itemClass}">
          <div class="review-header">
            <span style="font-size:16px;">${statusIcon}</span>
            <span class="q-num">第${q.order_num}题</span>
            <span class="q-type ${typeClass}">${q.type}</span>
            <span style="font-size:12px; color:var(--text-light);">科目${q.subject}</span>
            <span class="q-score">${q.score}分</span>
          </div>
          <div class="review-content">${q.content}</div>`;

        // 选项
        if (q.type !== '判断题') {
          const options = [
            { letter: 'A', text: q.option_a },
            { letter: 'B', text: q.option_b },
            { letter: 'C', text: q.option_c },
            { letter: 'D', text: q.option_d }
          ].filter(o => o.text);

          for (const opt of options) {
            const isUserChoice = userAns.includes(opt.letter);
            const isCorrectChoice = correctAns.includes(opt.letter);
            let bgClass = '';
            if (isCorrectChoice) bgClass = 'correct-bg';
            else if (isUserChoice && !isCorrectChoice) bgClass = 'wrong-bg';

            html += `<div class="review-option ${bgClass}">
              <strong>${opt.letter}.</strong> ${opt.text}
              ${isCorrectChoice ? ' <span style="color:#4CAF50;">✓</span>' : ''}
              ${isUserChoice && !isCorrectChoice ? ' <span style="color:#EF5350;">✗（你的选择）</span>' : ''}
              ${isUserChoice && isCorrectChoice ? ' <span style="color:#4CAF50;">✓（你的选择）</span>' : ''}
            </div>`;
          }
        } else {
          html += `<div class="review-ans-line">
            <strong>正确答案：</strong>${correctAns === 'A' ? '正确' : '错误'} |
            <strong>你的答案：</strong>${isUnanswered ? '未作答' : (userAns === 'A' ? '正确' : '错误')}
          </div>`;
        }

        html += `<div class="review-ans-line">
          <strong>你的答案：</strong><span style="color:${isCorrect ? '#4CAF50' : '#EF5350'};">${userAns || '未作答'}</span> |
          <strong>正确答案：</strong><span style="color:#4CAF50;">${correctAns}</span>
        </div>`;

        if (q.explanation) {
          html += `<div class="review-explain"><strong>解析：</strong>${q.explanation}</div>`;
        }

        html += '</div>';
      }

      document.getElementById('reviewSection').innerHTML = html;
    }

    function toggleReview() {
      const el = document.getElementById('reviewSection');
      const isHidden = el.style.display === 'none' || !el.classList.contains('show');
      if (isHidden) {
        el.classList.add('show');
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } else {
        el.classList.remove('show');
      }
    }

    function goExamStart() {
      window.location.href = '/exam-start.html';
    }

    function goHome() {
      window.location.href = '/exam-start.html';
    }

    init();
  </script>
</body>
</html>
