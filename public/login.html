<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 湖南绿盾卫士检测技术有限公司培训考核系统</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="shield">🛡️</div>
      <h1>湖南绿盾卫士检测技术有限公司</h1>
      <p>内部培训考核系统</p>
    </div>
    <div class="login-error" id="errorBox"></div>
    <form id="loginForm">
      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="username" placeholder="请输入用户名" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">登 录</button>
    </form>
    <div style="text-align:center; margin-top:20px; font-size:12px; color:var(--text-light);">
      <p>管理员默认账号：admin / admin123</p>
      <p>依据《湖南省检验检测机构关键岗位人员考试大纲（2025年版）》</p>
    </div>
  </div>

  <script>
    const errorBox = document.getElementById('errorBox');
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');

    // 检查是否已登录
    fetch('/api/me').then(r => r.json()).then(data => {
      if (data.user) {
        if (data.user.role === 'admin') {
          window.location.href = '/admin.html';
        } else {
          window.location.href = '/exam-start.html';
        }
      }
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.remove('show');
      loginBtn.textContent = '登录中...';
      loginBtn.disabled = true;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          if (data.user.role === 'admin') {
            window.location.href = '/admin.html';
          } else {
            window.location.href = '/exam-start.html';
          }
        } else {
          errorBox.textContent = data.error || '登录失败';
          errorBox.classList.add('show');
        }
      } catch (err) {
        errorBox.textContent = '网络错误，请重试';
        errorBox.classList.add('show');
      }
      loginBtn.textContent = '登 录';
      loginBtn.disabled = false;
    });
  </script>
</body>
</html>
