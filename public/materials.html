<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>资料库 - 培训考核系统</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .materials-page { min-height: 100vh; background: #F0F2F5; }

    .materials-banner {
      background: linear-gradient(135deg, #1B7A3D 0%, #2E8B57 50%, #43A047 100%);
      padding: 32px 28px;
      color: white;
      border-radius: 0 0 20px 20px;
      margin-bottom: 20px;
    }
    .materials-banner h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .materials-banner p {
      font-size: 14px;
      opacity: 0.85;
    }

    .materials-container {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 20px 40px;
    }

    .back-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .back-bar .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      background: white;
      border: 2px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      transition: all 0.2s;
    }
    .back-bar .btn-back:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .filter-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .filter-bar select {
      padding: 8px 14px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      background: white;
      outline: none;
    }

    .materials-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .material-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.06);
      padding: 20px;
      transition: all 0.2s;
      border: 2px solid transparent;
    }
    .material-card:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      border-color: var(--primary);
    }

    .material-card .file-icon {
      font-size: 36px;
      margin-bottom: 12px;
    }

    .material-card .file-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .material-card .file-meta {
      font-size: 12px;
      color: var(--text-light);
      margin-bottom: 12px;
    }

    .material-card .file-tags {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .material-card .btn-group {
      display: flex;
      gap: 10px;
    }

    .btn-view {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 8px 16px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-view:hover {
      background: var(--primary-dark);
    }

    .btn-download {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 8px 16px;
      background: white;
      color: var(--primary);
      border: 2px solid var(--primary);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-download:hover {
      background: var(--primary);
      color: white;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-light);
    }
    .empty-state .icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    /* 下载码弹窗 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-box {
      background: white;
      border-radius: 16px;
      padding: 32px;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 8px 40px rgba(0,0,0,0.2);
      animation: modalIn 0.2s ease;
    }
    @keyframes modalIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .modal-box h3 {
      font-size: 18px;
      margin-bottom: 8px;
      color: var(--text);
    }
    .modal-box p {
      font-size: 13px;
      color: var(--text-light);
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .modal-box input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 16px;
      font-family: monospace;
      letter-spacing: 2px;
      text-align: center;
      text-transform: uppercase;
      outline: none;
      margin-bottom: 16px;
    }
    .modal-box input:focus {
      border-color: var(--primary);
    }
    .modal-box .modal-error {
      display: none;
      color: #dc3545;
      font-size: 13px;
      margin-bottom: 12px;
      padding: 8px 12px;
      background: #fff5f5;
      border-radius: 6px;
    }
    .modal-box .modal-actions {
      display: flex;
      gap: 12px;
    }
    .modal-box .btn-modal-primary {
      flex: 1;
      padding: 10px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .modal-box .btn-modal-cancel {
      flex: 1;
      padding: 10px;
      background: #f0f0f0;
      color: var(--text);
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .loading-tip {
      text-align: center;
      padding: 8px;
      font-size: 13px;
      color: var(--text-light);
    }
  </style>
</head>
<body class="materials-page">

  <div class="materials-banner">
    <h1>资料库</h1>
    <p>法律法规、专业知识、管理体系及标准文件</p>
  </div>

  <div class="materials-container">
    <div class="back-bar">
      <button class="btn-back" onclick="window.location.href='/exam-start.html'">← 返回主页</button>
    </div>

    <div class="filter-bar">
      <select id="filterCategory" onchange="renderMaterials()">
        <option value="">全部分类</option>
        <option value="法律法规">法律法规</option>
        <option value="技术标准">技术标准</option>
        <option value="管理体系">管理体系</option>
        <option value="培训资料">培训资料</option>
        <option value="其他">其他</option>
      </select>
      <select id="filterType" onchange="renderMaterials()">
        <option value="">全部类型</option>
        <option value="word">Word文档</option>
        <option value="excel">Excel表格</option>
        <option value="pdf">PDF文档</option>
      </select>
    </div>

    <div id="materialsList" class="materials-list">
      <div class="empty-state">
        <div class="icon">⏳</div>
        <p>正在加载...</p>
      </div>
    </div>
  </div>

  <!-- 下载码弹窗 -->
  <div class="modal-overlay" id="codeModal">
    <div class="modal-box">
      <h3>🔐 输入下载码</h3>
      <p>下载文件需要下载码，请向管理员申请获取。</p>
      <div class="modal-error" id="codeError"></div>
      <input type="text" id="codeInput" placeholder="LDSV-XXXX-XXXX" maxlength="14" autocomplete="off">
      <div class="modal-actions">
        <button class="btn-modal-cancel" onclick="closeCodeModal()">取消</button>
        <button class="btn-modal-primary" id="confirmDownloadBtn" onclick="confirmDownload()">确认下载</button>
      </div>
    </div>
  </div>

  <script>
    let allMaterials = [];
    let pendingDownloadId = null;

    async function init() {
      try {
        const res = await fetch('/api/me');
        const data = await res.json();
        if (!data.user) {
          window.location.href = '/login.html';
          return;
        }
        if (data.user.role === 'admin') {
          window.location.href = '/admin.html';
          return;
        }

        const matRes = await fetch('/api/materials');
        const matData = await matRes.json();
        allMaterials = matData.materials || [];
        renderMaterials();
      } catch (err) {
        console.error('Init error:', err);
      }
    }

    function renderMaterials() {
      const category = document.getElementById('filterCategory').value;
      const type = document.getElementById('filterType').value;

      let filtered = allMaterials;
      if (category) filtered = filtered.filter(m => m.category === category);
      if (type) filtered = filtered.filter(m => m.filetype === type);

      if (filtered.length === 0) {
        document.getElementById('materialsList').innerHTML = `
          <div class="empty-state" style="grid-column:1/-1;">
            <div class="icon">📂</div>
            <p>暂无资料</p>
          </div>`;
        return;
      }

      let html = '';
      for (const m of filtered) {
        const icon = m.filetype === 'word' ? '📄' :
                     m.filetype === 'excel' ? '📊' :
                     m.filetype === 'pdf' ? '📕' : '📎';
        const typeLabel = m.filetype === 'word' ? 'Word' :
                          m.filetype === 'excel' ? 'Excel' :
                          m.filetype === 'pdf' ? 'PDF' : '文件';
        const sizeStr = m.filesize ? formatSize(m.filesize) : '';

        html += `<div class="material-card">
          <div class="file-icon">${icon}</div>
          <div class="file-title">${m.title}</div>
          <div class="file-meta">${m.filename}${sizeStr ? ' · ' + sizeStr : ''}</div>
          <div class="file-tags">
            <span class="tag tag-blue">${typeLabel}</span>
            ${m.category ? `<span class="tag tag-gray">${m.category}</span>` : ''}
            <span class="tag tag-gray">${new Date(m.created_at).toLocaleDateString('zh-CN')}</span>
          </div>
          ${m.description ? `<div style="font-size:13px; color:var(--text-light); margin-bottom:12px;">${m.description}</div>` : ''}
          <div class="btn-group">
            <button class="btn-view" onclick="viewMaterial(${m.id})">👁 查看</button>
            <button class="btn-download" onclick="openCodeModal(${m.id})">⬇ 下载</button>
          </div>
        </div>`;
      }
      document.getElementById('materialsList').innerHTML = html;
    }

    function viewMaterial(id) {
      window.open(`/material-viewer.html?id=${id}`, '_blank');
    }

    function openCodeModal(id) {
      pendingDownloadId = id;
      document.getElementById('codeInput').value = '';
      document.getElementById('codeError').style.display = 'none';
      document.getElementById('codeModal').classList.add('active');
      setTimeout(() => document.getElementById('codeInput').focus(), 100);
    }

    function closeCodeModal() {
      document.getElementById('codeModal').classList.remove('active');
      pendingDownloadId = null;
    }

    async function confirmDownload() {
      if (!pendingDownloadId) return;
      const code = document.getElementById('codeInput').value.trim().toUpperCase();
      const errorEl = document.getElementById('codeError');
      const btn = document.getElementById('confirmDownloadBtn');

      if (!code) {
        errorEl.textContent = '请输入下载码';
        errorEl.style.display = 'block';
        return;
      }

      btn.textContent = '验证中...';
      btn.disabled = true;
      errorEl.style.display = 'none';

      try {
        const res = await fetch(`/api/materials/${pendingDownloadId}/download`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code })
        });

        if (!res.ok) {
          const data = await res.json();
          errorEl.textContent = data.error || '下载码验证失败';
          errorEl.style.display = 'block';
          btn.textContent = '确认下载';
          btn.disabled = false;
          return;
        }

        // 下载成功，获取文件名
        const blob = await res.blob();
        const material = allMaterials.find(m => m.id === pendingDownloadId);
        const filename = material ? material.filename : 'download';

        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        a.remove();

        closeCodeModal();
        btn.textContent = '确认下载';
        btn.disabled = false;
      } catch (err) {
        errorEl.textContent = '网络错误，请重试';
        errorEl.style.display = 'block';
        btn.textContent = '确认下载';
        btn.disabled = false;
      }
    }

    // 回车确认
    document.getElementById('codeInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') confirmDownload();
      if (e.key === 'Escape') closeCodeModal();
    });

    // 点击遮罩关闭
    document.getElementById('codeModal').addEventListener('click', (e) => {
      if (e.target.id === 'codeModal') closeCodeModal();
    });

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    init();
  </script>
</body>
</html>
