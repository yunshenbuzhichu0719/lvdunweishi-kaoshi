<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>考试中 - 培训考核系统</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="exam-page">
  <!-- 考试头部 -->
  <div class="exam-header">
    <h1>🛡️ 湖南绿盾卫士检测技术有限公司 - 培训考核系统</h1>
    <div class="flex gap-16" style="align-items:center;">
      <div class="exam-timer" id="timer">⏱ 90:00</div>
      <button class="btn btn-danger btn-sm" onclick="confirmSubmit()">交卷</button>
    </div>
  </div>

  <!-- 切屏警告 -->
  <div class="exam-switch-warning" id="switchWarning">
    ⚠️ 检测到切屏！剩余次数: <span id="switchRemaining">2</span>
  </div>

  <!-- 考试主体 -->
  <div class="exam-body">
    <!-- 题目区域 -->
    <div class="exam-questions-panel" id="questionsPanel">
      <div class="empty-state">
        <div class="icon">⏳</div>
        <p>正在加载考试内容...</p>
      </div>
    </div>

    <!-- 侧边导航 -->
    <div class="exam-sidebar">
      <div class="card">
        <div class="card-title">答题进度 <span id="totalCountLabel" style="font-size:13px; color:var(--text-light); font-weight:400;">共0题</span></div>
        <div style="font-size:13px; color:var(--text-light); margin-bottom:8px;">
          已答: <span id="answeredCount" style="color:var(--primary); font-weight:700;">0</span> / <span id="totalCount">0</span>
        </div>
        <div id="navGrid"></div>
        <div class="nav-legend">
          <div class="nav-legend-item"><span></span> 未答</div>
          <div class="nav-legend-item"><span class="legend-answered"></span> 已答</div>
          <div class="nav-legend-item"><span class="legend-current"></span> 当前题</div>
        </div>
        <div class="nav-timer-box">
          <div class="timer-label">⏱ 剩余时间</div>
          <div class="timer-value" id="timerSidebar">90:00</div>
        </div>
        <button class="btn btn-primary btn-block" style="margin-top:16px;" onclick="confirmSubmit()">提交试卷</button>
      </div>
    </div>
  </div>

  <!-- 确认交卷模态框 -->
  <div class="modal-overlay" id="submitModal">
    <div class="modal">
      <div class="modal-title">确认交卷</div>
      <div id="submitInfo"></div>
      <div class="alert alert-warning">
        提交后无法修改答案，确定要交卷吗？
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeModal('submitModal')">继续考试</button>
        <button class="btn btn-primary" onclick="submitExam('manual')">确认交卷</button>
      </div>
    </div>
  </div>

  <script src="/js/exam.js"></script>
</body>
</html>
